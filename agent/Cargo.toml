[package]
name = "fmn-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"                 # web server
tokio = { version = "1", features = ["full"] }   # async runtime
serde = { version = "1", features = ["derive"] }  # JSON in/out
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] } # call OpenAI + model-svc
rusqlite = { version = "0.31", features = ["bundled"] }       # SQLite (no system install)
sha2 = "0.10"               # chain-hash
ed25519-dalek = "2"         # cert signing keys (agent side, if needed)
base64 = "0.22"             # decode pass
hex = "0.4"                 # decode pass
unicode-normalization = "0.1" # homoglyph/zero-width handling
uuid = { version = "1", features = ["v4"] }       # event ids
chrono = "0.4"              # timestamps
tracing = "0.1"             # logging
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }   # the CLI
anyhow = "1"                # easy error handling
thiserror = "1"
dotenvy = "0.15"            # .env file loading
regex = "1"                 # pattern scrubbing in obs/scrub

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.4", features = ["util"] }
