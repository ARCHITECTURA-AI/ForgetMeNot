[project]
name = "forgetmenot-model"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "presidio-analyzer>=2.2",     # NER + PII recognizers
  "presidio-anonymizer>=2.2",
  "spacy>=3.7",                 # language model backend for Presidio
  "sentence-transformers>=3.0", # semantic similarity
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
